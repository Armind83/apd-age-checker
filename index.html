<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>A.P.D Security - Companion App</title>
  <meta name="theme-color" content="#0d0d0d">
  <script src="mrz.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0d0d0d;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 80px 16px 20px 16px;
      position: relative;
    }
    .top-left-logo {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #e65100;
      box-shadow: 0 4px 16px rgba(230, 81, 0, 0.5);
    }
    .logo-container {
      width: 90px;
      height: 90px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background-color: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      text-align: center;
      margin-bottom: 16px;
    }
    .label {
      font-size: 0.85rem;
      color: #b0b0b0;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }
    .cutoff-date {
      font-size: 2.2rem;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .cutoff-sub {
      font-size: 0.85rem;
      color: #ff9800;
      font-weight: 700;
      text-transform: uppercase;
    }
    .btn-group {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      width: 100%;
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 800;
      border-radius: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn-primary {
      background-color: #e65100;
      box-shadow: 0 4px 16px rgba(230, 81, 0, 0.4);
    }
    .btn-primary:active {
      background-color: #bf360c;
    }
    .btn-secondary {
      background-color: #212121;
      border: 1px solid #333333;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    .btn-secondary:active {
      background-color: #333333;
    }
    .licence-box {
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 400px;
      margin-top: 12px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .licence-input {
      width: 100%;
      padding: 12px;
      background: #0d0d0d;
      border: 1px solid #444;
      color: #fff;
      font-size: 1.1rem;
      border-radius: 10px;
      text-align: center;
    }
    .result-box {
      margin-top: 16px;
      padding: 20px;
      border-radius: 14px;
      font-size: 1.3rem;
      font-weight: 900;
      display: none;
      text-align: center;
      width: 100%;
      max-width: 400px;
      white-space: pre-line;
    }
    .entry-allowed {
      background-color: #1b3a20;
      color: #4caf50;
      border: 3px solid #2e7d32;
    }
    .entry-denied {
      background-color: #3e1a1a;
      color: #f44336;
      border: 3px solid #c62828;
    }
  </style>
</head>
<body>

  <img src="1793758190930.jpg" alt="Security Logo" class="top-left-logo" onError="this.style.display='none'">

  <div class="logo-container">
    <svg viewBox="0 0 200 200" width="90" height="90" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 20 L160 50 V100 C160 140 100 175 100 175 C100 175 40 140 40 100 V50 Z" fill="none" stroke="#e65100" stroke-width="8"/>
      <path d="M100 35 L145 58 V100 C145 130 100 158 100 158 C100 158 55 130 55 100 V58 Z" fill="none" stroke="#777777" stroke-width="4"/>
      <text x="100" y="95" font-family="sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">A.P.D</text>
      <path d="M30 110 Q100 140 170 80" fill="none" stroke="#e65100" stroke-width="5"/>
    </svg>
  </div>

  <div class="card">
    <div class="label">Must be born on or before:</div>
    <div class="cutoff-date" id="cutoff-date">-- --- ----</div>
    <div class="cutoff-sub">To be 18 years of age today</div>
  </div>

  <div class="btn-group">
    <button class="btn btn-primary" onclick="startCamera()">📷 Scan Passport</button>
    <button class="btn btn-secondary" onclick="toggleLicenceBox()">🆔 Check Driving Licence</button>
    <a href="https://app.securitymanager.cloud/observations.php" target="_blank" class="btn btn-secondary">📋 Observations</a>
    <a href="https://app.securitymanager.cloud/add-incident.php" target="_blank" class="btn btn-secondary">⚠️ Add Incident</a>
  </div>

  <div class="licence-box" id="licence-box">
    <div class="label" style="margin:0;">Enter Birth Year (Field 3):</div>
    <input type="number" id="birth-year" class="licence-input" placeholder="e.g. 2006" oninput="checkLicenceYear(this.value)">
  </div>

  <div id="result-box" class="result-box"></div>

  <script>
    let cutoffYear = 2008;

    function init() {
      const today = new Date();
      const options = { day: 'numeric', month: 'short', year: 'numeric' };
      const cutoff = new Date(today.getFullYear() - 18, today.getMonth(), today.getDate());
      cutoffYear = cutoff.getFullYear();
      document.getElementById('cutoff-date').innerText = cutoff.toLocaleDateString('en-GB', options);
    }

    function toggleLicenceBox() {
      const box = document.getElementById('licence-box');
      box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
      document.getElementById('birth-year').focus();
    }

    function checkLicenceYear(val) {
      if (val.length === 4) {
        const year = parseInt(val, 10);
        const resultBox = document.getElementById('result-box');
        resultBox.style.display = 'block';

        if (year <= cutoffYear) {
          resultBox.className = 'result-box entry-allowed';
          resultBox.innerText = `BORN: ${year}\n\n✅ ENTRY ALLOWED (18+)`;
        } else {
          resultBox.className = 'result-box entry-denied';
          resultBox.innerText = `BORN: ${year}\n\n🛑 UNDER 18 (REFUSE ENTRY)`;
        }
      }
    }

    init();
  </script>
</body>
</html>
