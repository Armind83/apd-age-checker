<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>A.P.D Security - Passport Scanner</title>
  <meta name="theme-color" content="#0d0d0d">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0d0d0d;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 16px;
    }
    .logo-container {
      width: 100px;
      height: 100px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background-color: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 28px 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      text-align: center;
      margin-bottom: 16px;
    }
    .label {
      font-size: 0.85rem;
      color: #b0b0b0;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }
    .cutoff-date {
      font-size: 2.3rem;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .cutoff-sub {
      font-size: 0.85rem;
      color: #ff9800;
      font-weight: 700;
      text-transform: uppercase;
    }
    .scan-btn {
      width: 100%;
      max-width: 400px;
      background-color: #e65100;
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(230, 81, 0, 0.4);
    }
    .scan-btn:active {
      transform: scale(0.98);
      background-color: #bf360c;
    }
    .camera-container {
      width: 100%;
      max-width: 400px;
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 16px;
    }
    video {
      width: 100%;
      border-radius: 14px;
      border: 2px solid #e65100;
      background-color: #000;
    }
    .status-text {
      font-size: 0.85rem;
      color: #aaaaaa;
      margin-top: 10px;
      text-align: center;
    }
    .result-box {
      margin-top: 16px;
      padding: 20px;
      border-radius: 14px;
      font-size: 1.3rem;
      font-weight: 900;
      display: none;
      text-align: center;
      width: 100%;
      max-width: 400px;
      white-space: pre-line;
    }
    .entry-allowed {
      background-color: #1b3a20;
      color: #4caf50;
      border: 3px solid #2e7d32;
    }
    .entry-denied {
      background-color: #3e1a1a;
      color: #f44336;
      border: 3px solid #c62828;
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <svg viewBox="0 0 200 200" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 20 L160 50 V100 C160 140 100 175 100 175 C100 175 40 140 40 100 V50 Z" fill="none" stroke="#e65100" stroke-width="8"/>
      <path d="M100 35 L145 58 V100 C145 130 100 158 100 158 C100 158 55 130 55 100 V58 Z" fill="none" stroke="#777777" stroke-width="4"/>
      <text x="100" y="95" font-family="sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">A.P.D</text>
      <path d="M30 110 Q100 140 170 80" fill="none" stroke="#e65100" stroke-width="5"/>
    </svg>
  </div>

  <div class="card">
    <div class="label">Must be born on or before:</div>
    <div class="cutoff-date" id="cutoff-date">-- --- ----</div>
    <div class="cutoff-sub">To be 18 years of age today</div>
  </div>

  <button class="scan-btn" onclick="startCamera()">📷 Scan Passport</button>

  <div class="camera-container" id="camera-container">
    <video id="video" autoplay playsinline></video>
    <div class="status-text" id="status-text">Camera ready.</div>
  </div>

  <div id="result-box" class="result-box"></div>

  <script>
    // Force unregister any stale service workers causing cache issues
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }

    function init() {
      const today = new Date();
      const options = { day: 'numeric', month: 'short', year: 'numeric' };
      const cutoff = new Date(today.getFullYear() - 18, today.getMonth(), today.getDate());
      document.getElementById('cutoff-date').innerText = cutoff.toLocaleDateString('en-GB', options);
    }

    let videoStream = null;

    async function startCamera() {
      const cameraContainer = document.getElementById('camera-container');
      const resultBox = document.getElementById('result-box');
      const video = document.getElementById('video');
      const statusText = document.getElementById('status-text');

      resultBox.style.display = 'none';
      cameraContainer.style.display = 'flex';
      statusText.innerText = "Opening camera...";

      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "environment" } 
        });
        video.srcObject = videoStream;
        statusText.innerText = "Camera active.";
      } catch (err) {
        statusText.innerText = "Camera access denied or unavailable.";
      }
    }

    init();
  </script>
</body>
</html>
