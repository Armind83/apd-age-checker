<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>A.P.D Security - Companion App</title>
  <meta name="theme-color" content="#0d0d0d">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0d0d0d;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 80px 16px 20px 16px;
      position: relative;
    }
    /* Top Left Logo Image (Chucky) */
    .top-left-logo {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #e65100;
      box-shadow: 0 4px 16px rgba(230, 81, 0, 0.5);
    }
    /* Top Right Logo Image (Scooby) */
    .top-right-logo {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #e65100;
      box-shadow: 0 4px 16px rgba(230, 81, 0, 0.5);
    }
    .logo-container {
      width: 90px;
      height: 90px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background-color: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      text-align: center;
      margin-bottom: 16px;
    }
    .label {
      font-size: 0.85rem;
      color: #b0b0b0;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }
    .cutoff-date {
      font-size: 2.2rem;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .cutoff-sub {
      font-size: 0.85rem;
      color: #ff9800;
      font-weight: 700;
      text-transform: uppercase;
    }
    .btn-group {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      width: 100%;
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 800;
      border-radius: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn-primary {
      background-color: #e65100;
      box-shadow: 0 4px 16px rgba(230, 81, 0, 0.4);
    }
    .btn-primary:active {
      background-color: #bf360c;
    }
    .btn-secondary {
      background-color: #212121;
      border: 1px solid #333333;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    .btn-secondary:active {
      background-color: #333333;
    }
    .id-drawer {
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 400px;
      margin-top: 12px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .id-guide {
      background-color: #0d0d0d;
      border: 1px dashed #e65100;
      border-radius: 12px;
      padding: 12px;
      text-align: left;
      font-size: 0.8rem;
      color: #aaa;
      line-height: 1.4;
    }
    .guide-field {
      color: #ff9800;
      font-weight: 800;
    }
    .id-input {
      width: 100%;
      padding: 12px;
      background: #0d0d0d;
      border: 1px solid #444;
      color: #fff;
      font-size: 1.1rem;
      border-radius: 10px;
      text-align: center;
    }
    .result-box {
      margin-top: 16px;
      padding: 20px;
      border-radius: 14px;
      font-size: 1.3rem;
      font-weight: 900;
      display: none;
      text-align: center;
      width: 100%;
      max-width: 400px;
      white-space: pre-line;
    }
    .entry-allowed {
      background-color: #1b3a20;
      color: #4caf50;
      border: 3px solid #2e7d32;
    }
    .entry-denied {
      background-color: #3e1a1a;
      color: #f44336;
      border: 3px solid #c62828;
    }
  </style>
</head>
<body>

  <!-- Top Left Logo Image (Chucky) -->
  <img src="1793758190930.jpg" alt="Security Logo Left" class="top-left-logo" onError="this.style.display='none'">

  <!-- Top Right Logo Image (Scooby) -->
  <img src="1793760298423~2.jpg" alt="Security Logo Right" class="top-right-logo" onError="this.style.display='none'">

  <div class="logo-container">
    <svg viewBox="0 0 200 200" width="90" height="90" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 20 L160 50 V100 C160 140 100 175 100 175 C100 175 40 140 40 100 V50 Z" fill="none" stroke="#e65100" stroke-width="8"/>
      <path d="M100 35 L145 58 V100 C145 130 100 158 100 158 C100 158 55 130 55 100 V58 Z" fill="none" stroke="#777777" stroke-width="4"/>
      <text x="100" y="95" font-family="sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">A.P.D</text>
      <path d="M30 110 Q100 140 170 80" fill="none" stroke="#e65100" stroke-width="5"/>
    </svg>
  </div>

  <div class="card">
    <div class="label">Must be born on or before:</div>
    <div class="cutoff-date" id="cutoff-date">-- --- ----</div>
    <div class="cutoff-sub">To be 18 years of age today
