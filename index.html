<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>A.P.D Security - Companion App</title>
  <meta name="theme-color" content="#0d0d0d">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0d0d0d;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 16px;
    }
    .logo-container {
      width: 100px;
      height: 100px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background-color: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 28px 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      text-align: center;
      margin-bottom: 16px;
    }
    .label {
      font-size: 0.85rem;
      color: #b0b0b0;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }
    .cutoff-date {
      font-size: 2.3rem;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .cutoff-sub {
      font-size: 0.85rem;
      color: #ff9800;
      font-weight: 700;
      text-transform: uppercase;
    }
    .btn-group {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      width: 100%;
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 800;
      border-radius: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary {
      background-color: #e65100;
      box-shadow: 0 4px 16px rgba(230, 81, 0, 0.4);
    }
    .btn-primary:active {
      background-color: #bf360c;
    }
    /* Fullscreen Drawer for Security Manager */
    .portal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0d0d0d;
      z-index: 999;
      display: none;
      flex-direction: column;
    }
    .portal-header {
      background-color: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .portal-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #ff9800;
      text-transform: uppercase;
    }
    .close-btn {
      background-color: #e65100;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <svg viewBox="0 0 200 200" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 20 L160 50 V100 C160 140 100 175 100 175 C100 175 40 140 40 100 V50 Z" fill="none" stroke="#e65100" stroke-width="8"/>
      <path d="M100 35 L145 58 V100 C145 130 100 158 100 158 C100 158 55 130 55 100 V58 Z" fill="none" stroke="#777777" stroke-width="4"/>
      <text x="100" y="95" font-family="sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">A.P.D</text>
      <path d="M30 110 Q100 140 170 80" fill="none" stroke="#e65100" stroke-width="5"/>
    </svg>
  </div>

  <div class="card">
    <div class="label">Must be born on or before:</div>
    <div class="cutoff-date" id="cutoff-date">-- --- ----</div>
    <div class="cutoff-sub">To be 18 years of age today</div>
  </div>

  <div class="btn-group">
    <button class="btn btn-primary" onclick="openPortal()">📋 Observations</button>
  </div>

  <!-- Security Manager Fullscreen Overlay -->
  <div class="portal-overlay" id="portal-overlay">
    <div class="portal-header">
      <span class="portal-title">Observations Portal</span>
      <button class="close-btn" onclick="closePortal()">← Back to App</button>
    </div>
    <iframe id="portal-frame" src="about:blank"></iframe>
  </div>

  <script>
    function init() {
      const today = new Date();
      const options = { day: 'numeric', month: 'short', year: 'numeric' };
      const cutoff = new Date(today.getFullYear() - 18, today.getMonth(), today.getDate());
      document.getElementById('cutoff-date').innerText = cutoff.toLocaleDateString('en-GB', options);
    }

    function openPortal() {
      const overlay = document.getElementById('portal-overlay');
      const frame = document.getElementById('portal-frame');
      
      if (frame.src === "about:blank") {
        frame.src = "https://app.securitymanager.cloud/observations.php";
      }
      
      overlay.style.display = 'flex';
    }

    function closePortal() {
      document.getElementById('portal-overlay').style.display = 'none';
    }

    init();
  </script>
</body>
</html>
